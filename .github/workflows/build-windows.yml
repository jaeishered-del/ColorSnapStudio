name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: scripts\build_windows.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: ColorSnapStudio-Windows
          path: dist/ColorSnapStudio.exe
          if-no-files-found: error
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ColorSnapStudio.exe
