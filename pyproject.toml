[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="colorsnap-studio"
version="1.0.0"
description="ColorSnap Studio — local image color palette extraction for Windows 10/11"
readme="README.md"
requires-python=">=3.11"
license={text="MIT"}
dependencies=["PySide6>=6.6","Pillow>=10","numpy>=1.26"]
[project.optional-dependencies]
dev=["pytest>=8","pyinstaller>=6"]
[project.gui-scripts]
colorsnap-studio="colorsnap.main:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
